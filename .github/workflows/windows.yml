name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Windows distribution
        run: .\gradlew.bat :desktopApp:createDistributable

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: TypingSpeed-Windows
          path: desktopApp/build/compose/binaries/main/app/**
